name: GLaDOS multi-account check-in

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    # GitHub cron uses UTC: 12:31 and 15:31 in Asia/Shanghai.
    - cron: '31 4,7 * * *'

permissions:
  contents: read

concurrency:
  group: glados-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify multi-account behavior
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests without account secrets
        run: python -m unittest discover -s tests -v
      - name: Verify browser extension account handling
        run: |
          node extension/test-classify.js
          node extension/test-accounts.js

  checkin:
    name: Check in all accounts
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install check-in browser
        run: python -m playwright install --with-deps chromium
      - name: Run multi-account check-in
        run: xvfb-run --auto-servernum python checkin.py
        env:
          PYTHONUNBUFFERED: '1'
          GLADOS_ACCOUNTS: ${{ secrets.GLADOS_ACCOUNTS }}
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}
          GLADOS_BROWSER_FALLBACK: 'true'
          GLADOS_BROWSER_HEADLESS: 'false'
          PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
      - name: Keep scheduled workflow active
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/gladosCheck.yml/enable"

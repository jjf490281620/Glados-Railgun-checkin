name: Verify GLaDOS browser verification

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '复制 Cookie 时的登录设备'
        type: choice
        default: macos
        options: [macos, windows, linux, iphone, ios, android]

permissions:
  contents: read

jobs:
  verify:
    name: Verify official page verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Verify sessions and official verification
        run: xvfb-run --auto-servernum python browser_probe.py --platform "$LOGIN_PLATFORM"
        env:
          LOGIN_PLATFORM: ${{ inputs.platform }}
          PYTHONUNBUFFERED: '1'
          GLADOS_BROWSER_HEADLESS: 'false'
          GLADOS_ACCOUNTS: ${{ secrets.GLADOS_ACCOUNTS }}
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
